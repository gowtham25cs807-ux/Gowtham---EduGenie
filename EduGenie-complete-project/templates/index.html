<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduGenie — AI Learning Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
    <header class="hero">
        <div class="container">
            <div class="brand">EduGenie</div>
            <h1>Learn smarter with Gemini-powered AI</h1>
            <p>
                Ask questions, simplify difficult concepts, summarize study material,
                generate quizzes, and build a learning path.
            </p>
        </div>
    </header>

    <main class="container">
        <section class="card">
            <div class="task-grid">
                <button class="task-btn active" data-task="qa">Q&A</button>
                <button class="task-btn" data-task="explain">Explain</button>
                <button class="task-btn" data-task="summarize">Summary</button>
                <button class="task-btn" data-task="quiz">Quiz</button>
                <button class="task-btn" data-task="learn">Learning Path</button>
            </div>

            <div id="qa-panel" class="panel">
                <label for="qa-input">Ask your question</label>
                <textarea id="qa-input" placeholder="Example: What is an operating system?"></textarea>
            </div>

            <div id="explain-panel" class="panel hidden">
                <label for="explain-input">Topic</label>
                <input id="explain-input" placeholder="Example: Pythagoras theorem">
                <label for="explain-level">Level</label>
                <select id="explain-level">
                    <option value="beginner">Beginner</option>
                    <option value="school student">School student</option>
                    <option value="college student">College student</option>
                    <option value="advanced">Advanced</option>
                </select>
            </div>

            <div id="summarize-panel" class="panel hidden">
                <label for="summary-input">Study material</label>
                <textarea id="summary-input" placeholder="Paste your paragraph or notes here..."></textarea>
            </div>

            <div id="quiz-panel" class="panel hidden">
                <label for="quiz-input">Study material</label>
                <textarea id="quiz-input" placeholder="Paste a topic or passage for the quiz..."></textarea>
                <label for="quiz-count">Number of questions</label>
                <select id="quiz-count">
                    <option value="3">3</option>
                    <option value="5">5</option>
                    <option value="10">10</option>
                </select>
            </div>

            <div id="learn-panel" class="panel hidden">
                <label for="learn-topic">Topic</label>
                <input id="learn-topic" placeholder="Example: SQL">
                <label for="learn-level">Current level</label>
                <select id="learn-level">
                    <option value="beginner">Beginner</option>
                    <option value="intermediate">Intermediate</option>
                    <option value="advanced">Advanced</option>
                </select>
                <label for="learn-goal">Goal</label>
                <input id="learn-goal" value="Understand the topic and build practical skills">
            </div>

            <button id="submit-btn" class="submit-btn">Ask EduGenie</button>
            <div id="status" class="status"></div>
        </section>

        <section id="result-card" class="card result-card hidden">
            <div class="result-header">
                <h2>Result</h2>
                <button id="copy-btn" class="small-btn">Copy</button>
            </div>
            <div id="result"></div>
        </section>
    </main>

    <footer>
        <div class="container">
            EduGenie · FastAPI + Google Gemini
        </div>
    </footer>

    <script src="{{ url_for('static', path='app.js') }}"></script>
</body>
</html>
